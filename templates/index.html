<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Discord Archive Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #313338; color: #dbdee1; }
    
    /* Barre latérale des salons */
    #sidebar { width: 320px; background-color: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #1f2023; }
    #search { padding: 10px 14px; border: none; background: #1e1f22; color: #fff; border-radius: 4px; margin: 12px; outline: none; font-size: 14px; }
    #channel-list { flex: 1; overflow-y: auto; list-style: none; }
    .channel-item { padding: 9px 14px; cursor: pointer; border-radius: 4px; margin: 2px 8px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #949ba4; }
    .channel-item:hover { background-color: #35373c; color: #dbdee1; }
    .channel-item.active { background-color: #404249; color: #fff; font-weight: 500; }
    
    /* Zone principale des messages */
    #chat-container { flex: 1; display: flex; flex-direction: column; }
    #header { height: 48px; padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid #202225; font-weight: bold; background: #313338; font-size: 15px; color: #f2f3f5; }
    #messages-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    
    /* Rendu des messages */
    .message { display: flex; flex-direction: column; line-height: 1.4; }
    .message-meta { font-size: 12px; color: #949ba4; margin-bottom: 3px; display: flex; align-items: baseline; gap: 8px; }
    .message-meta .author { font-weight: 600; color: #f2f3f5; font-size: 14px; }
    .message-meta .author.contact { color: #5865f2; }
    .message-text { color: #dbdee1; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
    .message-att { font-size: 12px; margin-top: 5px; color: #00a8fc; }
  </style>
</head>
<body>

  <div id="sidebar">
    <input type="text" id="search" placeholder="Rechercher un contact, salon...">
    <ul id="channel-list"></ul>
  </div>

  <div id="chat-container">
    <div id="header">Sélectionne une discussion sur la gauche</div>
    <div id="messages-box"></div>
  </div>

  <script>
    let allChannels = [];

    fetch('/api/channels')
      .then(res => res.json())
      .then(channels => {
        allChannels = channels;
        renderChannels(channels);
      });

    function renderChannels(channels) {
      const list = document.getElementById('channel-list');
      list.innerHTML = '';
      channels.forEach(ch => {
        const li = document.createElement('li');
        li.className = 'channel-item';
        const prefix = ch.is_dm ? '@ ' : '# ';
        li.textContent = `${prefix}${ch.name}`;
        li.title = ch.name;
        li.onclick = () => loadChannel(ch, li);
        list.appendChild(li);
      });
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const filtered = allChannels.filter(c => String(c.name).toLowerCase().includes(val));
      renderChannels(filtered);
    });

    function loadChannel(ch, element) {
      document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      
      const prefix = ch.is_dm ? '@ ' : '# ';
      document.getElementById('header').textContent = `${prefix}${ch.name}`;

      const box = document.getElementById('messages-box');
      box.innerHTML = '<div style="color: #949ba4;">Chargement de la discussion...</div>';

      fetch(`/api/channel/${ch.id}`)
        .then(res => res.json())
        .then(messages => {
          box.innerHTML = '';
          if (!messages || messages.length === 0) {
            box.innerHTML = '<div style="color: #949ba4;">Aucun message trouvé.</div>';
            return;
          }

          messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'message';

            const date = (msg.Timestamp || '').replace('T', ' ').slice(0, 19);
            const content = msg.Contents || msg.content || '';
            const att = msg.Attachments ? `<div class="message-att">📎 Pièce jointe : ${escapeHtml(msg.Attachments)}</div>` : '';

            // Détermination de l'auteur :
            // Si le message a un auteur spécifié dans son objet JSON, on le prend
            // Sinon, Discord n'ayant extrait que tes messages, c'est "Moi"
            let authorName = "Moi";
            let isContact = false;

            if (msg.author && typeof msg.author === 'object') {
              authorName = msg.author.name || msg.author.username || msg.author.id || "Moi";
              if (ch.dm_user && authorName !== "Moi") isContact = true;
            } else if (msg.author || msg.Author || msg.user) {
              authorName = msg.author || msg.Author || msg.user;
              if (ch.dm_user && authorName !== "Moi") isContact = true;
            }

            div.innerHTML = `
              <div class="message-meta">
                <span class="author ${isContact ? 'contact' : ''}">${escapeHtml(authorName)}</span>
                <span>${date}</span>
              </div>
              <div class="message-text">${escapeHtml(content)}</div>
              ${att}
            `;
            box.appendChild(div);
          });
          box.scrollTop = box.scrollHeight;
        });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
